<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sparring while writing</title>
  <meta name="description" content="Prototype of a writing interface: an endless scroll where an AI writes a short thought in the margin when it has something worth adding.">
  <meta name="theme-color" content="#0b0a09">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d2b27'/%3E%3Crect x='9' y='5' width='14' height='22' rx='1' fill='%23e8d9b2'/%3E%3Crect x='6' y='4' width='20' height='4' rx='2' fill='%23a3764a'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/KleeOne-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="img/roll-l.png" as="image">
  <link rel="preload" href="img/bin.png" as="image">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" id="stage">
    <aside class="shelf" id="shelf">
      <nav class="rack" id="rail" aria-label="Scrolls">
        <div class="rack__cap">Scrolls</div>
        <div class="rack__list" id="list"></div>
        <button class="si si--new" id="addBtn" type="button">
          <span class="si__hole"><i class="si__plus"></i></span>
          <span class="si__t">New scroll</span>
        </button>
      </nav>
      <div class="binrow">
        <button class="bin" id="bin" type="button" aria-label="Delete this scroll">
          <img src="img/bin.png" width="88" height="113" alt="" draggable="false">
        </button>
      </div>
    </aside>
    <section class="main">
      <div class="scrollwrap" id="wrap">
        <div class="sheetbox" id="box"></div>
        <div class="rollshade"></div>
        <div class="roller" aria-hidden="true">
          <i class="roller__m"></i><i class="roller__l"></i><i class="roller__r"></i>
          <b class="band band--l"></b><b class="band band--r"></b>
        </div>
        <div class="trashlayer" id="trashlayer" aria-hidden="true"></div>
        <div class="stuck" id="stuck">
          <div class="stuck__menu" id="stuckMenu" role="menu" hidden>
            <button type="button" role="menuitem" data-mode="push">Give me a push</button>
            <button type="button" role="menuitem" data-mode="counter">Argue against me</button>
            <button type="button" role="menuitem" data-mode="earlier">What did I say before?</button>
          </div>
          <button class="stuck__btn" id="stuckBtn" type="button" aria-haspopup="menu" aria-expanded="false"><i class="stuck__spark"></i><span>I'm stuck</span></button>
        </div>
      </div>
    </section>
  </main>
  <div class="confirm" id="confirm" role="dialog" aria-label="Delete scroll" hidden>
    <p>Would you really like to delete this scroll?</p>
    <div class="confirm__row">
      <button type="button" data-act="cancel">Keep it</button>
      <button type="button" data-act="delete" class="is-danger">Delete</button>
    </div>
  </div>
  <div class="palette" id="palette" role="dialog" aria-label="Scroll color" hidden></div>

  <script src="app.js"></script>
</body>
</html>

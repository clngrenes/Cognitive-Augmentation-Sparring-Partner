<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sparring while writing</title>
  <meta name="description" content="Prototype of a writing interface: a vintage notebook where an AI writes a short thought in the margin when it has something worth adding.">
  <meta name="theme-color" content="#0b0a09">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d2b27'/%3E%3Crect x='6' y='7' width='20' height='18' rx='2' fill='%23e8d9b2'/%3E%3Crect x='15' y='7' width='2' height='18' fill='%23b9a574'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/KleeOne-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <div class="book" id="book">
      <div class="book__cover"></div>
      <div class="book__pages">
        <div class="paper paper--l pg"></div>
        <div class="paper paper--r pg"></div>
      </div>
      <div class="book__spreads" id="spreads"></div>
      <div class="leafslot" id="leafslot"></div>
      <button class="corner corner--prev" id="prev" type="button" aria-label="Previous page"></button>
      <button class="corner corner--next" id="next" type="button" aria-label="Next page"></button>
      <div class="ftabs ftabs--l" id="tabsL" aria-label="Earlier notes"></div>
      <div class="ftabs ftabs--r" id="tabsR" aria-label="Notes"></div>
      <div class="trashlayer" id="trashlayer" aria-hidden="true"></div>
      <button class="bin" id="bin" type="button" aria-label="Delete this note">
        <svg viewBox="0 0 64 74" width="52" height="61" aria-hidden="true">
          <defs>
            <linearGradient id="binb" x1="0" x2="1"><stop offset="0" stop-color="#6f6858"/><stop offset=".45" stop-color="#9a927e"/><stop offset="1" stop-color="#5d5748"/></linearGradient>
          </defs>
          <path d="M9 18 L14 68 Q14.4 71 18 71 L46 71 Q49.6 71 50 68 L55 18 Z" fill="url(#binb)"/>
          <g stroke="#3f3a30" stroke-width="1.3" opacity=".55" fill="none"><path d="M20 20 L22 70"/><path d="M27 20 L28 70"/><path d="M34 20 L34 70"/><path d="M41 20 L40 70"/><path d="M48 20 L46 70"/></g>
          <path d="M11 33 L53 33 M12.2 48 L51.8 48 M13.2 62 L50.8 62" stroke="#3f3a30" stroke-width="1.6" opacity=".6" fill="none"/>
          <ellipse cx="32" cy="18" rx="24" ry="6.4" fill="#2a251e"/>
          <ellipse cx="32" cy="18" rx="24" ry="6.4" fill="none" stroke="#b3aa92" stroke-width="2.4"/>
        </svg>
      </button>
      <div class="confirm" id="confirm" role="dialog" aria-label="Delete note" hidden>
        <p>Would you really like to delete this note?</p>
        <div class="confirm__row">
          <button type="button" data-act="cancel">Keep it</button>
          <button type="button" data-act="delete" class="is-danger">Delete</button>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>

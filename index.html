<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sparring while writing</title>
  <meta name="description" content="Prototype of a writing interface: an endless scroll where an AI writes a short thought in the margin when it has something worth adding.">
  <meta name="theme-color" content="#0b0a09">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d2b27'/%3E%3Crect x='9' y='5' width='14' height='22' rx='1' fill='%23e8d9b2'/%3E%3Crect x='6' y='4' width='20' height='4' rx='2' fill='%23a3764a'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/KleeOne-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" id="stage">
    <nav class="rail" id="rail" aria-label="Scrolls">
      <div class="rail__cap">Scrolls</div>
      <div class="rail__list" id="list"></div>
      <button class="si si--new" id="addBtn" type="button">
        <svg class="si__icon" viewBox="0 0 30 38" aria-hidden="true"><rect x="5" y="3" width="20" height="5" rx="2.5" class="roll"/><path d="M7.5 8 H22.5 V30 H7.5 Z" class="paper"/><rect x="5" y="29" width="20" height="5" rx="2.5" class="roll"/><path d="M15 14 V25 M9.5 19.5 H20.5" class="plus"/></svg>
        <span class="si__t">New scroll</span>
      </button>
    </nav>
    <section class="main">
      <div class="scrollwrap" id="wrap">
        <div class="sheetbox" id="box"></div>
        <div class="rollshade"></div>
        <div class="roller" aria-hidden="true"><i class="cap cap--l"></i><i class="cap cap--r"></i></div>
        <div class="trashlayer" id="trashlayer" aria-hidden="true"></div>
      </div>
      <div class="binrow">
        <button class="bin" id="bin" type="button" aria-label="Delete this scroll">
          <svg viewBox="0 0 64 74" width="52" height="61" aria-hidden="true">
            <defs>
              <linearGradient id="binb" x1="0" x2="1"><stop offset="0" stop-color="#6f6858"/><stop offset=".45" stop-color="#9a927e"/><stop offset="1" stop-color="#5d5748"/></linearGradient>
            </defs>
            <path d="M9 18 L14 68 Q14.4 71 18 71 L46 71 Q49.6 71 50 68 L55 18 Z" fill="url(#binb)"/>
            <g stroke="#3f3a30" stroke-width="1.3" opacity=".55" fill="none"><path d="M20 20 L22 70"/><path d="M27 20 L28 70"/><path d="M34 20 L34 70"/><path d="M41 20 L40 70"/><path d="M48 20 L46 70"/></g>
            <path d="M11 33 L53 33 M12.2 48 L51.8 48 M13.2 62 L50.8 62" stroke="#3f3a30" stroke-width="1.6" opacity=".6" fill="none"/>
            <ellipse cx="32" cy="18" rx="24" ry="6.4" fill="#2a251e"/>
            <ellipse cx="32" cy="18" rx="24" ry="6.4" fill="none" stroke="#b3aa92" stroke-width="2.4"/>
          </svg>
        </button>
      </div>
    </section>
  </main>
  <div class="confirm" id="confirm" role="dialog" aria-label="Delete scroll" hidden>
    <p>Would you really like to delete this scroll?</p>
    <div class="confirm__row">
      <button type="button" data-act="cancel">Keep it</button>
      <button type="button" data-act="delete" class="is-danger">Delete</button>
    </div>
  </div>
  <div class="palette" id="palette" role="dialog" aria-label="Scroll color" hidden></div>

  <script src="app.js"></script>
</body>
</html>
